name: CPU data and protocol tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: OmniCommit tests
        run: python -m pytest -q
      - name: Second streaming ASR tests
        run: python -m pytest -q Second/tests
      - name: Meeting page and transcript export
        run: node tests/test_web_ui_contract.mjs
      - name: Check training, export and server launchers
        run: |
          find SFT-Scripts Second/SFT-Scripts -name '*.sh' -print0 | xargs -0 -n 1 bash -n
          bash -n start_server.sh
          bash -n Second/start_server.sh
